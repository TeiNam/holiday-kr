[package]
name = "holiday-kr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "South Korean public holidays (including substitute and temporary holidays), embedded from KASI data. No API key, network, or dependencies."
license = "MIT OR Apache-2.0"
repository = "https://github.com/TeiNam/holiday-kr"
readme = "README.md"
keywords = ["holiday", "korea", "korean", "calendar", "public-holiday"]
categories = ["date-and-time"]
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-*"]

[dependencies]

[workspace]
members = ["gen"]
